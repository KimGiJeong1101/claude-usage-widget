<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="i18n.js"></script>
<style>
  .usage-card {
    padding: 14px;
    border-left: 4px solid var(--severity, var(--card-border));
    background: linear-gradient(120deg, var(--severity-wash, transparent), var(--card-bg) 55%);
    transition: border-color 0.3s ease, background 0.3s ease;
    flex: 1;
    display: flex;
  }
  .usage-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: 1; }
  .usage-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .usage-title { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; }
  .usage-reset { line-height: 1.4; }
  .ring { position: relative; width: 80px; height: 80px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring-track { fill: none; stroke: #edeef1; stroke-width: 12; }
  .ring-fill {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    filter: drop-shadow(0 1px 2px rgba(20, 20, 30, 0.12));
    transition: stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
  }
  .ring-percent {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .opacity-strip {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--card-border);
    flex: none;
  }
  .opacity-strip.visible {
    display: flex;
  }
  .opacity-strip input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .opacity-strip span {
    font-size: 12px;
    color: var(--muted);
    width: 34px;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="12" y1="20" x2="12" y2="8"/>
          <line x1="18" y1="20" x2="18" y2="4"/>
        </svg>
      </div>
      <div class="title" data-i18n="usage.title">Claude 사용량</div>
      <button class="icon-btn tone-accent" id="btn-opacity" title="투명도" data-i18n-title="usage.opacity_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="icon-btn tone-accent" id="btn-pin" title="고정" data-i18n-title="usage.pin_tooltip">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path id="pin-path" d="M9 4h6l-1 6 3 2v2H7v-2l3-2z" fill="none"/>
          <line x1="12" y1="14" x2="9" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn tone-accent" id="btn-refresh" title="새로고침" data-i18n-title="usage.refresh_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 11-3-6.7"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
      <button class="icon-btn tone-danger" id="btn-close" title="닫기" data-i18n-title="common.close_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="opacity-strip" id="opacity-strip">
      <input type="range" id="opacity" min="40" max="100" step="5">
      <span id="opacity-value"></span>
    </div>
    <div class="body">
      <div class="card usage-card" data-key="session">
        <div class="usage-row">
          <div class="usage-info">
            <div class="usage-title" data-i18n="usage.session_label">세션 (5시간)</div>
            <div class="usage-reset muted"></div>
          </div>
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <circle class="ring-track" cx="50" cy="50" r="42"></circle>
              <circle class="ring-fill" cx="50" cy="50" r="42"></circle>
            </svg>
            <div class="ring-percent">0%</div>
          </div>
        </div>
      </div>
      <div class="card usage-card" data-key="week">
        <div class="usage-row">
          <div class="usage-info">
            <div class="usage-title" data-i18n="usage.week_label">주간</div>
            <div class="usage-reset muted"></div>
          </div>
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <circle class="ring-track" cx="50" cy="50" r="42"></circle>
              <circle class="ring-fill" cx="50" cy="50" r="42"></circle>
            </svg>
            <div class="ring-percent">0%</div>
          </div>
        </div>
      </div>
    </div>
    <div class="resize-grip" title="크기 조절" data-i18n-title="common.resize_tooltip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 13l-6 6M19 19h-4M19 19v-4"/>
      </svg>
    </div>
  </div>

<script>
  const CIRC = 2 * Math.PI * 42;
  const colorVar = (p) => (p >= 90 ? "--red" : p >= 70 ? "--yellow" : "--green");
  const cardFor = (key) => document.querySelector(`.card[data-key="${key}"]`);

  function hexToRgb(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function paintRing(key, percent, animate) {
    const card = cardFor(key);
    const fill = card.querySelector(".ring-fill");
    const percentLabel = card.querySelector(".ring-percent");
    const p = Math.max(0, Math.min(100, percent));
    const color = getComputedStyle(document.documentElement).getPropertyValue(colorVar(p)).trim();
    const [r, g, b] = hexToRgb(color);
    const offset = CIRC * (1 - p / 100);

    card.style.setProperty("--severity", color);
    card.style.setProperty("--severity-wash", `rgba(${r}, ${g}, ${b}, 0.12)`);

    fill.style.transition = "none";
    fill.style.strokeDasharray = `${CIRC}`;
    if (!animate) {
      fill.style.stroke = color;
      fill.style.strokeDashoffset = `${offset}`;
      percentLabel.textContent = `${p}%`;
      return;
    }
    fill.style.strokeDashoffset = `${CIRC}`;
    void fill.getBoundingClientRect();
    requestAnimationFrame(() => {
      fill.style.transition = "";
      fill.style.stroke = color;
      fill.style.strokeDashoffset = `${offset}`;
    });
    percentLabel.textContent = `${p}%`;
  }

  function paint(data, animate) {
    paintRing("session", data.session.percent, animate);
    cardFor("session").querySelector(".usage-reset").textContent = data.session.reset_text;
    paintRing("week", data.week.percent, animate);
    cardFor("week").querySelector(".usage-reset").textContent = data.week.reset_text;
  }

  let pinned = false;
  const pinBtn = document.getElementById("btn-pin");
  pinBtn.addEventListener("click", () => {
    pinned = !pinned;
    pinBtn.classList.toggle("pinned", pinned);
    document.getElementById("pin-path").setAttribute("fill", pinned ? "currentColor" : "none");
  });

  const refreshBtn = document.getElementById("btn-refresh");
  refreshBtn.addEventListener("click", async () => {
    if (refreshBtn.classList.contains("spinning")) return;
    refreshBtn.classList.add("spinning");
    try {
      const data = await window.pywebview.api.refresh();
      if (data) {
        paint(data, false);
      } else {
        refreshBtn.style.color = "var(--red)";
        setTimeout(() => (refreshBtn.style.color = ""), 1200);
      }
    } finally {
      refreshBtn.classList.remove("spinning");
    }
  });

  document.getElementById("btn-close").addEventListener("click", () => {
    window.pywebview.api.close();
  });

  const opacityBtn = document.getElementById("btn-opacity");
  const opacityStrip = document.getElementById("opacity-strip");
  const opacityInput = document.getElementById("opacity");
  const opacityValueLabel = document.getElementById("opacity-value");

  // 투명도 슬라이더가 들어있는 띠(opacity-strip)를 그냥 CSS로 숨기고
  // 보여주기만 하면(visibility 토글), 창 크기는 고정된 채로 그 안의 카드들이
  // 남는 공간에 억지로 쑤셔넣어지듯 찌그러진다. 그래서 그 대신 실제 창
  // 크기 자체를 이 띠의 높이만큼 늘리거나 줄인다.
  // 여기서 resize_by가 아니라 resize_height_by를 쓰는 이유는, 드래그
  // 손잡이(그립) 쪽에서 쓰는 resize_by와 달리 이건 사람이 마우스로 드래그하는
  // 게 아니라 자동으로 일어나는 크기 조절이라 눈으로 따라갈 커서 자체가
  // 없기 때문이다. 게다가 팝업이 화면의 어느 모서리를 기준으로 열렸느냐에
  // 따라(작업표시줄을 침범하지 않으려고) 아래로 자라는 대신 위로 자랄 수도
  // 있다 (webui.py의 _box_vertical_resizer 참고).
  opacityBtn.addEventListener("click", () => {
    const opening = !opacityStrip.classList.contains("visible");
    if (opening) {
      opacityStrip.classList.add("visible");
      window.pywebview.api.resize_height_by(opacityStrip.offsetHeight);
    } else {
      const stripHeight = opacityStrip.offsetHeight;
      opacityStrip.classList.remove("visible");
      window.pywebview.api.resize_height_by(-stripHeight);
    }
  });

  // 이 팝업 전체는 드래그해서 창을 옮길 수 있게 되어 있는데(pywebview가
  // window에 심어주는 기본 제공 easy_drag 리스너 참고), 이걸 막아두지 않으면
  // 슬라이더의 손잡이(thumb)를 누르는 mousedown조차 "창을 드래그해서
  // 옮기려는 시도"로 가로채여서, 슬라이더를 움직이려던 게 창을 통째로
  // 옮기는 동작이 되어버린다.
  opacityInput.addEventListener("mousedown", (ev) => ev.stopPropagation());

  // 네이티브(OS) 창 자체의 투명도(webui.py의 _apply_window_opacity 참고)를
  // 조절하는 방식이라, 텍스트를 포함해서 창 전체가 통째로 하나처럼
  // 흐려진다 -- 페이지 안의 내용물에만 CSS 트릭을 거는 방식이 아니다.
  // preview_opacity()는 슬라이더를 드래그하는 매 순간(tick)마다 저장 없이
  // 곧바로 미리보기만 적용하고, set_opacity()는 드래그를 놓는(release)
  // 순간에 한 번 더 적용하면서 이번엔 설정값을 실제로 저장(persist)한다.
  opacityInput.addEventListener("input", () => {
    const value = opacityInput.value;
    opacityValueLabel.textContent = `${value}%`;
    window.pywebview.api.preview_opacity(parseInt(value, 10));
  });

  opacityInput.addEventListener("change", () => {
    window.pywebview.api.set_opacity(parseInt(opacityInput.value, 10));
  });

  // 타이머를 취소할 수 있게 만든 이유: 이 작은 팝업의 가장자리 근처에 있는
  // 헤더 버튼을 누르려다가 커서가 아주 잠깐 테두리 밖으로 살짝 나갔다가
  // 250ms의 유예 시간 안에 다시 들어온 경우까지 창이 닫혀버리면 안 되기
  // 때문이다 -- mouseenter 때 타이머를 지워주지 않으면, 타이머가 실제로
  // 발동하는 시점에는 그저 `pinned`(고정 여부) 값만 확인할 뿐, 그 사이에
  // 커서가 실제로 되돌아왔는지는 전혀 체크하지 않게 된다.
  let leaveTimer = null;
  document.addEventListener("mouseleave", () => {
    if (pinned) return;
    leaveTimer = setTimeout(() => {
      if (!pinned) window.pywebview.api.close();
    }, 250);
  });
  document.addEventListener("mouseenter", () => {
    if (leaveTimer) {
      clearTimeout(leaveTimer);
      leaveTimer = null;
    }
  });

  // mouseleave만으로는, 애초에 커서가 팝업 "안"에 들어와 있던 경우에만
  // 창을 닫을 수 있다 -- 팝업이 커서 바로 그 위치에서 정확히 열릴 때는
  // 이걸로 충분했다. 하지만 이제는 팝업이 작업표시줄/트레이 근처에 고정된
  // 위치에서 열리기 때문에(webui.py의 _position_near_tray 참고), 커서는
  // 처음부터 팝업 바깥에 있는 경우가 흔하다. 이럴 땐 mouseleave 자체가
  // 아예 한 번도 발생하지 않아서, 사용자가 우연히 한 번이라도 팝업 위를
  // 스쳐 지나가기 전까지는 창이 계속 열려있는 상태로 남아버린다.
  // 대신 네이티브(OS) 창이 포커스(활성 상태)를 잃었을 때 닫는 방식은
  // 커서가 어디서 시작했는지와 무관하게 항상 동작하고, 실제 윈도우의
  // 볼륨/네트워크/배터리 같은 플라이아웃(flyout, 화면 한쪽에서 떴다가
  // 다른 곳을 클릭하면 닫히는 작은 팝업)이 다른 곳을 클릭하는 순간 바로
  // 닫히는 동작과도 일치한다. 다만 이 blur 감지는 페이지가 로드되는 즉시가
  // 아니라, 창이 실제로 다 열리고 나서 약간(300ms) 지난 뒤에야 켠다 --
  // 네이티브 창이 생성되고 위치를 잡는(positioning) 과정 자체에서 자리를
  // 잡기 전에 순간적으로 포커스가 깜빡였다가 안정되는 경우가 있을 수
  // 있기 때문이다 -- 창이 나타나자마자 스스로 닫혀버리면, 지금 고치려는
  // 버그보다 오히려 더 나쁜 상황이 된다.
  let blurCloseArmed = false;
  window.addEventListener("blur", () => {
    if (blurCloseArmed && !pinned) window.pywebview.api.close();
  });

  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_initial_data();
    applyI18n(data.language || "ko");
    paint(data, true);
    const opacity = data.opacity ?? 100;
    opacityInput.value = opacity;
    opacityValueLabel.textContent = `${opacity}%`;
    initResizeGrip();
    setTimeout(() => (blurCloseArmed = true), 300);
  });

  // 이 팝업이 열려있는 동안 백그라운드 자동갱신 스레드(thread, 메인 흐름과
  // 별개로 동시에 돌아가는 작업 단위)가 새 데이터를 받아왔을 때, Python
  // 쪽(webui.push_usage_update)에서 이 함수를 호출해준다.
  window.__pushUsage = (data) => paint(data, true);
</script>
</body>
</html>
