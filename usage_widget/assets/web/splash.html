<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="i18n.js"></script>
<style>
  .panel {
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px 20px;
  }
  .splash-logo {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .splash-logo svg {
    width: 30px;
    height: 30px;
    color: #fff;
  }
  .splash-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    animation: spin 0.9s linear infinite;
  }
  .spinner circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 46 66;
  }
  #splash-status {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="12" y1="20" x2="12" y2="8"/>
        <line x1="18" y1="20" x2="18" y2="4"/>
      </svg>
    </div>
    <div class="splash-name">Claude Usage Widget</div>
    <svg class="spinner" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
    </svg>
    <div id="splash-status" data-i18n="splash.status">실행 중입니다...</div>
  </div>

<script>
  // No js_api round-trip beyond which language to render in -- the splash
  // has nothing else to show or call back into, and it's gone again within
  // a few seconds either way.
  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_language();
    applyI18n(data.language || "ko");
  });
</script>
</body>
</html>
