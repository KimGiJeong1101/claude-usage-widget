<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="i18n.js"></script>
<style>
  #status-label { margin: 0; }
  #status-value { margin: 6px 0 0; font-size: 13.5px; font-weight: 600; line-height: 1.4; word-break: break-all; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  #logout-btn:hover { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.3); color: var(--red); }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
        </svg>
      </div>
      <div class="title" data-i18n="account.title">계정</div>
      <button class="icon-btn tone-danger" id="btn-close" title="닫기" data-i18n-title="common.close_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="body">
      <div class="card">
        <p class="field-label" id="status-label">현재 로그인</p>
        <p id="status-value">확인 중...</p>
      </div>
      <div class="actions">
        <button class="primary" id="switch-btn">계정 변경</button>
        <button class="secondary" id="logout-btn" style="display: none;" data-i18n="account.logout_button">로그아웃</button>
      </div>
    </div>
    <div class="resize-grip" title="크기 조절" data-i18n-title="common.resize_tooltip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 13l-6 6M19 19h-4M19 19v-4"/>
      </svg>
    </div>
  </div>

<script>
  document.getElementById("btn-close").addEventListener("click", () => {
    window.pywebview.api.close();
  });
  document.getElementById("switch-btn").addEventListener("click", () => {
    window.pywebview.api.switch_account();
    window.pywebview.api.close();
  });
  document.getElementById("logout-btn").addEventListener("click", () => {
    window.pywebview.api.logout();
    window.pywebview.api.close();
  });

  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_initial_data();
    const lang = data.language || "ko";
    applyI18n(lang);
    document.getElementById("status-label").textContent = data.is_logged_out
      ? i18nText(lang, "account.status_logged_out_label")
      : i18nText(lang, "account.status_logged_in_label");
    document.getElementById("status-value").textContent = data.is_logged_out
      ? i18nText(lang, "account.logged_out_value")
      : (data.email || i18nText(lang, "account.checking"));
    document.getElementById("switch-btn").textContent = data.is_logged_out
      ? i18nText(lang, "account.login_button")
      : i18nText(lang, "account.switch_button");
    if (!data.is_logged_out) {
      document.getElementById("logout-btn").style.display = "";
    }
    initResizeGrip();
  });
</script>
</body>
</html>
