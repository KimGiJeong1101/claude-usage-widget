<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="i18n.js"></script>
<style>
  .identity-row { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    flex: none;
  }
  .avatar.logged-out { background: var(--card-border); color: var(--muted); }
  .identity-text { min-width: 0; }
  .identity-name { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .identity-email { margin: 3px 0 0; font-size: 12px; color: var(--muted); line-height: 1.3; word-break: break-all; }
  .org-row {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--card-border);
    font-size: 12px;
    color: var(--muted);
  }
  .org-row svg { width: 14px; height: 14px; flex: none; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  #logout-btn:hover { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.3); color: var(--red); }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
        </svg>
      </div>
      <div class="title" data-i18n="account.title">계정</div>
      <button class="icon-btn tone-danger" id="btn-close" title="닫기" data-i18n-title="common.close_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="body">
      <div class="card">
        <div class="identity-row">
          <div class="avatar" id="avatar">?</div>
          <div class="identity-text">
            <p class="identity-name" id="identity-name">확인 중...</p>
            <p class="identity-email" id="identity-email"></p>
          </div>
        </div>
        <div class="org-row" id="org-row" title="소속 조직" data-i18n-title="account.organization_tooltip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V7a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v14"/>
            <path d="M14 10h5a1 1 0 0 1 1 1v10"/>
            <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
            <path d="M4 21h16"/>
          </svg>
          <span id="org-name"></span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="switch-btn">계정 변경</button>
        <button class="secondary" id="logout-btn" style="display: none;" data-i18n="account.logout_button">로그아웃</button>
      </div>
    </div>
    <div class="resize-grip" title="크기 조절" data-i18n-title="common.resize_tooltip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 13l-6 6M19 19h-4M19 19v-4"/>
      </svg>
    </div>
  </div>

<script>
  document.getElementById("btn-close").addEventListener("click", () => {
    window.pywebview.api.close();
  });
  document.getElementById("switch-btn").addEventListener("click", () => {
    window.pywebview.api.switch_account();
    window.pywebview.api.close();
  });
  document.getElementById("logout-btn").addEventListener("click", () => {
    window.pywebview.api.logout();
    window.pywebview.api.close();
  });

  // 이메일만 달랑 한 줄 보여주던 걸, 아바타(이름 첫 글자) + 이름 + 이메일 +
  // (있으면) 소속 조직까지 보여주는 신원 카드로 채웠다 -- 어차피 로그아웃/
  // 계정 변경 말고는 더 넣을 기능이 없는 화면이라, 이미 bootstrap API
  // 응답에 들어있던(그런데 그동안 안 쓰고 버리던) 이름/소속 조직 정보로
  // 화면 자체를 덜 휑하게 채우는 쪽을 택했다.
  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_initial_data();
    const lang = data.language || "ko";
    applyTheme(data.theme);
    applyI18n(lang);

    const avatar = document.getElementById("avatar");
    const nameEl = document.getElementById("identity-name");
    const emailEl = document.getElementById("identity-email");
    const orgRow = document.getElementById("org-row");

    if (data.is_logged_out) {
      avatar.textContent = "?";
      avatar.classList.add("logged-out");
      nameEl.textContent = i18nText(lang, "account.logged_out_value");
      emailEl.textContent = "";
    } else {
      avatar.classList.remove("logged-out");
      const primary = data.name || data.email;
      if (primary) {
        avatar.textContent = primary.trim().charAt(0).toUpperCase();
        nameEl.textContent = primary;
        // 이름이 있으면 이메일은 보조 설명 줄로, 이름이 없으면(일부
        // 계정은 표시 이름이 비어있을 수 있음) 이메일 자체가 주 텍스트가
        // 되니 중복으로 또 보여줄 필요가 없다.
        emailEl.textContent = data.name ? (data.email || "") : "";
      } else {
        avatar.textContent = "?";
        nameEl.textContent = i18nText(lang, "account.checking");
        emailEl.textContent = "";
      }
      if (data.organization) {
        document.getElementById("org-name").textContent = data.organization;
        orgRow.style.display = "flex";
      }
    }

    document.getElementById("switch-btn").textContent = data.is_logged_out
      ? i18nText(lang, "account.login_button")
      : i18nText(lang, "account.switch_button");
    if (!data.is_logged_out) {
      document.getElementById("logout-btn").style.display = "";
    }
    initResizeGrip();
  });
</script>
</body>
</html>
