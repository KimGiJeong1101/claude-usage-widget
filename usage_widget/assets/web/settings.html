<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="i18n.js"></script>
<style>
  /* 리스트형 레이아웃 -- Windows 11 설정처럼 "한 줄 = 한 항목"(왼쪽 아이콘+이름,
     오른쪽 입력칸). 예전엔 항목마다 카드를 따로 쌓아서(이름 위, 입력칸 아래)
     테마 항목이 생긴 뒤 640px까지 길어졌고 "너무 길다"는 피드백이 있었다.
     한 카드 안에 줄로 나열하면 항목이 늘어도 한 줄(약 52px)씩만 길어진다. */
  .list { padding: 4px 16px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 6px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .row:last-child { border-bottom: none; }
  .row-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(59, 130, 246, 0.12);
    color: var(--accent);
  }
  .row-icon svg { width: 16px; height: 16px; }
  .row-text { flex: 1; min-width: 0; }
  .row-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row select { width: 132px; flex: none; padding-top: 6px; padding-bottom: 6px; }
  .row input[type="number"] { width: 64px; flex: none; padding: 6px 8px; text-align: right; }
  .unit { font-size: 12px; color: var(--muted); flex: none; }

  /* 체크박스를 토글 스위치 모양으로 -- 실제로는 그대로 <input type=checkbox>라서
     저장 로직(autostartCheckbox.checked)은 예전과 똑같다. */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 38px;
    height: 22px;
    margin: 0;
    border-radius: 11px;
    background: var(--track);
    position: relative;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(16px); }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
          <line x1="4" y1="18" x2="20" y2="18"></line><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="title" data-i18n="settings.title">설정</div>
      <button class="icon-btn tone-danger" id="btn-close" title="닫기" data-i18n-title="common.close_tooltip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="body">
      <div class="card list">
        <div class="row">
          <div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg></div>
          <div class="row-text"><div class="row-name" data-i18n="settings.language_label">언어</div></div>
          <select id="language-select"></select>
        </div>
        <div class="row">
          <div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg></div>
          <div class="row-text"><div class="row-name" data-i18n="settings.theme_label">테마</div></div>
          <select id="theme-select">
            <option value="system" data-i18n="settings.theme_system">시스템 설정</option>
            <option value="light" data-i18n="settings.theme_light">라이트</option>
            <option value="dark" data-i18n="settings.theme_dark">다크</option>
          </select>
        </div>
        <div class="row">
          <div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></div>
          <div class="row-text">
            <div class="row-name" data-i18n="settings.refresh_interval_label">자동갱신 주기</div>
            <div class="row-sub" data-i18n="settings.refresh_interval_hint">예: 900초 = 15분</div>
          </div>
          <input type="number" id="interval" min="5" step="1">
          <span class="unit" data-i18n="settings.seconds_unit">초</span>
        </div>
        <div class="row">
          <div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="14" width="18" height="7" rx="2"/><circle cx="17" cy="17.5" r="1.5" fill="currentColor"/></svg></div>
          <div class="row-text"><div class="row-name" data-i18n="settings.tray_style_label">트레이 아이콘</div></div>
          <select id="style-select"></select>
        </div>
        <div class="row" id="autostart-row">
          <div class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 7a8 8 0 1011.4 0"/></svg></div>
          <div class="row-text"><label class="row-name" for="autostart" data-i18n="settings.autostart_label">PC 시작 시 자동 실행</label></div>
          <input type="checkbox" class="switch" id="autostart">
        </div>
      </div>
      <button class="primary" id="save-btn" data-i18n="settings.save_button">저장</button>
    </div>
    <div class="resize-grip" title="크기 조절" data-i18n-title="common.resize_tooltip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 13l-6 6M19 19h-4M19 19v-4"/>
      </svg>
    </div>
  </div>

<script>
  const intervalInput = document.getElementById("interval");
  const styleSelect = document.getElementById("style-select");
  const languageSelect = document.getElementById("language-select");
  const themeSelect = document.getElementById("theme-select");
  const autostartRow = document.getElementById("autostart-row");
  const autostartCheckbox = document.getElementById("autostart");

  document.getElementById("btn-close").addEventListener("click", () => {
    window.pywebview.api.close();
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    await window.pywebview.api.save({
      refresh_seconds: parseInt(intervalInput.value, 10) || 60,
      tray_icon_style: styleSelect.value,
      autostart: autostartCheckbox.checked,
      language: languageSelect.value,
      theme: themeSelect.value,
    });
    window.pywebview.api.close();
  });

  // 언어 드롭다운 값이 바뀌는 즉시 이 화면에 있는 라벨들을 곧바로
  // 다시 번역해서 보여준다. 투명도 슬라이더와 같은 "저장하기 전에 미리
  // 보여준다"는 아이디어다 -- 실제로 저장하고 트레이 메뉴/다른 팝업들까지
  // 반영되게 하려면 여전히 저장(save) 버튼을 눌러야 한다. 트레이 아이콘
  // 스타일 드롭다운의 각 항목(option)들은 data-i18n 속성이 붙어있지
  // 않은데, 이 텍스트들은 팝업을 열었을 당시의 언어로 이미 번역되어
  // Python에서 내려온 것이기 때문이다. 그래서 이 항목들만은 여기서 따로
  // 직접 다시 라벨을 붙여줘야 하고, 안 그러면 이 화면에서 유일하게 실시간
  // 미리보기가 안 되는 요소가 되어버린다.
  languageSelect.addEventListener("change", () => {
    const lang = languageSelect.value;
    applyI18n(lang);
    for (const opt of styleSelect.options) {
      opt.textContent = trayStyleLabel(lang, opt.value);
    }
  });

  // 언어 드롭다운과 같은 "저장 전 미리보기"다 -- 고르는 즉시 이 설정 창에만
  // 먼저 적용해서 어떻게 보이는지 확인할 수 있고, 저장해야 다른 팝업들에도
  // 적용된다(webui.py의 _push_theme_to_open_popups).
  themeSelect.addEventListener("change", () => applyTheme(themeSelect.value));

  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_initial_data();
    applyTheme(data.theme);
    themeSelect.value = data.theme || "system";
    applyI18n(data.language || "ko");
    intervalInput.value = data.refresh_seconds;
    for (const [key, label] of Object.entries(data.style_labels)) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = label;
      styleSelect.appendChild(opt);
    }
    styleSelect.value = data.tray_icon_style;
    for (const [code, label] of Object.entries(data.language_options)) {
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = label;
      languageSelect.appendChild(opt);
    }
    languageSelect.value = data.language;
    if (data.show_autostart) {
      autostartCheckbox.checked = data.autostart_enabled;
    } else {
      autostartRow.style.display = "none";
    }
    initResizeGrip();
  });
</script>
</body>
</html>
