<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .card p.muted { margin: 8px 0 0; }
  .interval-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .interval-row input { width: 84px; }
  .interval-row span { font-size: 13px; color: var(--text); }
  #style-select { margin-top: 10px; }
  #save-btn { margin-top: 4px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
          <line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
          <line x1="4" y1="18" x2="20" y2="18"></line><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="title">설정</div>
      <button class="icon-btn tone-danger" id="btn-close" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="body">
      <div class="card">
        <p class="field-label">자동갱신 주기</p>
        <div class="interval-row">
          <input type="number" id="interval" min="5" step="1">
          <span>초</span>
        </div>
        <p class="muted">예: 900초 = 15분</p>
      </div>
      <div class="card">
        <p class="field-label">트레이 아이콘 스타일</p>
        <select id="style-select"></select>
        <div class="checkbox-row" id="autostart-row" style="margin-top: 14px;">
          <input type="checkbox" id="autostart">
          <label for="autostart">PC 시작 시 자동 실행</label>
        </div>
      </div>
      <button class="primary" id="save-btn">저장</button>
    </div>
    <div class="resize-grip" title="크기 조절">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M19 13l-6 6M19 19h-4M19 19v-4"/>
      </svg>
    </div>
  </div>

<script>
  const intervalInput = document.getElementById("interval");
  const styleSelect = document.getElementById("style-select");
  const autostartRow = document.getElementById("autostart-row");
  const autostartCheckbox = document.getElementById("autostart");

  document.getElementById("btn-close").addEventListener("click", () => {
    window.pywebview.api.close();
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    await window.pywebview.api.save({
      refresh_seconds: parseInt(intervalInput.value, 10) || 60,
      tray_icon_style: styleSelect.value,
      autostart: autostartCheckbox.checked,
    });
    window.pywebview.api.close();
  });

  window.addEventListener("pywebviewready", async () => {
    const data = await window.pywebview.api.get_initial_data();
    intervalInput.value = data.refresh_seconds;
    for (const [key, label] of Object.entries(data.style_labels)) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = label;
      styleSelect.appendChild(opt);
    }
    styleSelect.value = data.tray_icon_style;
    if (data.show_autostart) {
      autostartCheckbox.checked = data.autostart_enabled;
    } else {
      autostartRow.style.display = "none";
    }
    initResizeGrip();
  });
</script>
</body>
</html>
