[project]
name = "usage-widget"
version = "0.1.0"
description = "Desktop tray widget showing Claude.ai session/weekly usage limits"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "playwright>=1.40",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "sv-ttk>=2.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
