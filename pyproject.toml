[project]
name = "usage-widget"
dynamic = ["version"]
description = "Desktop tray widget showing Claude.ai session/weekly usage limits"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "playwright>=1.40",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "pywebview>=6.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["usage_widget*"]

[tool.setuptools.dynamic]
version = { attr = "usage_widget.__version__" }

[tool.setuptools.package-data]
usage_widget = ["assets/fonts/*.otf", "assets/fonts/LICENSE", "assets/web/*"]
