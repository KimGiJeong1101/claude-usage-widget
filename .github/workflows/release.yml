name: Release

# Builds Windows + macOS standalone builds and publishes them to a GitHub
# Release whenever a "v*" tag is pushed (e.g. v0.1.0). macOS is built on
# GitHub's own macos-latest runner -- a real Mac -- so no local Mac is
# needed. See claude-usage-widget-plan.md section 10 for the full plan.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Determine version from tag
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed --name ClaudeUsageWidget
          --icon installer/icon/ClaudeUsageWidget.ico
          --add-data "usage_widget/assets;usage_widget/assets"
          run.py

      - name: Zip the portable build
        # ClaudeUsageWidget-win.zip is the stable name self_update.py and
        # the README's "always latest" download links depend on -- it has
        # to stay exactly that on every release. The versioned copy
        # alongside it is just so a human looking at a downloaded file (or
        # the Releases page) can tell which build it actually is.
        run: |
          Compress-Archive -Path dist/ClaudeUsageWidget.exe -DestinationPath ClaudeUsageWidget-win.zip
          Compress-Archive -Path dist/ClaudeUsageWidget.exe -DestinationPath "ClaudeUsageWidget-$env:VERSION-win.zip"

      - name: Build MSI installer
        # Pinned to WiX v5 (pre-6): v6+ added an Open Source Maintenance Fee
        # EULA gate that isn't appropriate to auto-accept in CI for a
        # company-adjacent project -- see claude-usage-widget-plan.md
        # section 10.
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2
          wix build installer/ClaudeUsageWidget.wxs -d SourceExe=dist/ClaudeUsageWidget.exe -d ProductVersion=${{ env.VERSION }} -arch x64 -ext WixToolset.UI.wixext -o ClaudeUsageWidget.msi
          Copy-Item ClaudeUsageWidget.msi "ClaudeUsageWidget-$env:VERSION.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ClaudeUsageWidget-win.zip
            ClaudeUsageWidget.msi
            ClaudeUsageWidget-*-win.zip
            ClaudeUsageWidget-*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[build]"

      - name: Determine version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate macOS app icon (.icns)
        # sips/iconutil are macOS-native, so this (like the .dmg packaging
        # below) only runs here on the macos-latest runner -- no local Mac
        # needed, matching the approach in claude-usage-widget-plan.md
        # section 10.1. Source is the same master PNG used for the Windows
        # .ico (installer/icon/app_icon.png, see scripts/generate_app_icon.py).
        run: |
          mkdir AppIcon.iconset
          sips -z 16 16 installer/icon/app_icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 installer/icon/app_icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 installer/icon/app_icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 installer/icon/app_icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 installer/icon/app_icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 installer/icon/app_icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 installer/icon/app_icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 installer/icon/app_icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 installer/icon/app_icon.png --out AppIcon.iconset/icon_512x512.png
          cp installer/icon/app_icon.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o installer/icon/ClaudeUsageWidget.icns

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed --name ClaudeUsageWidget
          --icon installer/icon/ClaudeUsageWidget.icns
          --add-data "usage_widget/assets:usage_widget/assets"
          run.py

      - name: Package as .dmg
        # ClaudeUsageWidget-mac.dmg is the stable name self_update.py-style
        # "always latest" links depend on; the versioned copy is just so a
        # human can tell which build a downloaded file actually is.
        run: |
          hdiutil create -volname "ClaudeUsageWidget" \
            -srcfolder dist/ClaudeUsageWidget.app \
            -ov -format UDZO ClaudeUsageWidget-mac.dmg
          cp ClaudeUsageWidget-mac.dmg "ClaudeUsageWidget-$VERSION-mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            ClaudeUsageWidget-mac.dmg
            ClaudeUsageWidget-*-mac.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClaudeUsageWidget-win.zip
            ClaudeUsageWidget.msi
            ClaudeUsageWidget-mac.dmg
            ClaudeUsageWidget-*-win.zip
            ClaudeUsageWidget-*.msi
            ClaudeUsageWidget-*-mac.dmg
